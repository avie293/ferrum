plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-fabric"
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Same as the Minecraft launcher
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Keep the extracted native library and the config file out of the project directory
    def testRunDir = layout.buildDirectory.dir('test-run').get().asFile
    workingDir = testRunDir
    doFirst {
        testRunDir.mkdirs()
    }
}

// Native library: built with cargo for the current platform, or taken from a directory of
// prebuilt libraries laid out as <platform>/<library> (used by CI to bundle every platform).
def hostPlatform = {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def osName = os.contains('win') ? 'windows' : os.contains('mac') ? 'macos' : 'linux'
    def archName = arch in ['amd64', 'x86_64'] ? 'x86_64' : arch in ['aarch64', 'arm64'] ? 'aarch64' : arch
    return "${osName}-${archName}"
}()
def nativeLibraryName = hostPlatform.startsWith('windows') ? 'ferrum.dll'
        : hostPlatform.startsWith('macos') ? 'libferrum.dylib' : 'libferrum.so'
def prebuiltNatives = providers.gradleProperty('natives_dir')

def cargoBuild = tasks.register('cargoBuild', Exec) {
    workingDir = file('native')
    commandLine 'cargo', 'build', '--release', '--locked'
    inputs.files(fileTree('native') { exclude 'target/**' })
    outputs.file("native/target/release/${nativeLibraryName}")
}

def collectNatives = tasks.register('collectNatives', Sync) {
    into layout.buildDirectory.dir('generated/natives')
    if (prebuiltNatives.isPresent()) {
        from(prebuiltNatives) { into 'natives' }
    } else {
        from(cargoBuild) { into "natives/${hostPlatform}" }
    }
}

sourceSets.main.resources.srcDir(collectNatives)

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = java_version as int
}

processResources {
    def props = [
            version              : version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_author           : mod_author,
            mod_description      : mod_description,
            mod_license          : mod_license,
            mod_homepage         : mod_homepage,
            mod_sources          : mod_sources,
            mod_issues           : mod_issues,
            java_version         : java_version,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
    ]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }
}

sourcesJar {
    exclude 'natives/**'
}

jar {
    def modId = mod_id
    inputs.property 'modId', modId

    from('LICENSE') {
        rename { "${it}_${modId}" }
    }
}
