[package]
name = "ferrum"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = { version = "0.9.4", features = ["zeroize"] }
cfb8 = { version = "0.9.1", features = ["zeroize"] }
zlib-rs = "0.6.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
