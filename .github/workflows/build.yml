name: Build

on: [push, pull_request]

jobs:
  natives:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, file: ferrum.dll }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, file: libferrum.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64, file: libferrum.so }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-aarch64, file: libferrum.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64, file: libferrum.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build native library
        working-directory: native
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: native/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  build:
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          path: natives
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build -Pnatives_dir=natives
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ferrum-artifacts
          path: |
            build/libs/
